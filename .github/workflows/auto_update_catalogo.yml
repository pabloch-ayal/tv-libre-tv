name: Actualizar Catalogo Diario

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar canales vivos y sumar nuevos
        run: python3 actualizar_catalogo.py

      - name: Guardar cambios en catalogo.json
        run: |
          git config user.name "Bot TV Libre"
          git config user.email "bot@users.noreply.github.com"
          git add catalogo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizacion automatica de canales vivos" && git push)
